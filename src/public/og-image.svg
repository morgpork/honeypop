<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Honey Pop — lip balm in a wooden matchbox">
  <!-- Paper background -->
  <rect width="1200" height="630" fill="#fcfbf7"/>

  <!-- Centered Honey & Grapefruit lid (280x440 scaled up) -->
  <g transform="translate(460, 95)">
    <!-- Deep band: 18% -->
    <rect x="0" y="0" width="280" height="79" fill="#6b2812"/>
    <text x="20" y="52" font-family="'Space Grotesk', system-ui, sans-serif" font-size="24" font-weight="700" fill="#f2d9c7" letter-spacing="0.5">Honey Pop</text>

    <!-- Dominant band: 54% -->
    <rect x="0" y="79" width="280" height="238" fill="#e4622a"/>
    <text x="20" y="200" font-family="'Space Grotesk', system-ui, sans-serif" font-size="36" font-weight="700" fill="#f2d9c7" letter-spacing="-0.5">HONEY</text>
    <text x="20" y="240" font-family="'Space Grotesk', system-ui, sans-serif" font-size="36" font-weight="700" fill="#f2d9c7" letter-spacing="-0.5">&amp; GRAPEFRUIT</text>

    <!-- Light band: 28% -->
    <rect x="0" y="317" width="280" height="123" fill="#f2d9c7"/>
    <text x="20" y="395" font-family="'Space Mono', ui-monospace, monospace" font-size="10" font-weight="400" fill="#6b2812" letter-spacing="1.2">PŌHUTUKAWA · COROMANDEL</text>
    <text x="20" y="415" font-family="'Space Mono', ui-monospace, monospace" font-size="10" font-weight="400" fill="#6b2812" letter-spacing="1.2">NZ · 100 % HONEY BALM</text>
  </g>

  <!-- Tagline right column -->
  <g transform="translate(800, 280)">
    <text font-family="Newsreader, Georgia, serif" font-size="52" font-weight="600" fill="#98512b">
      <tspan x="0" y="0">Lip balm</tspan>
      <tspan x="0" y="60">in a wooden</tspan>
      <tspan x="0" y="120">matchbox.</tspan>
    </text>
    <text x="0" y="175" font-family="'Space Mono', ui-monospace, monospace" font-size="13" font-weight="400" fill="#7e7469" letter-spacing="1.5">FROM $25 NZD · NZ</text>
  </g>

  <!-- Hairline -->
  <line x1="80" y1="570" x2="1120" y2="570" stroke="#e2d5c5" stroke-width="1"/>

  <!-- Footer meta -->
  <text x="80" y="600" font-family="'Space Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#7e7469" letter-spacing="1.5">HONEYPOP.CO.NZ</text>
  <text x="1120" y="600" text-anchor="end" font-family="'Space Mono', ui-monospace, monospace" font-size="12" font-weight="400" fill="#7e7469" letter-spacing="1.5">© Honey Pop 2026</text>
</svg>
